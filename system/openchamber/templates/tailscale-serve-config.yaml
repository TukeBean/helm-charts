{{- if .Values.tailscale.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: openchamber-tailscale-serve
  labels:
    {{- include "openchamber.labels" . | nindent 4 }}
data:
  serve.json: |
    {
      "TCP": { "443": { "HTTPS": true } },
      "Web": {
        "${TS_CERT_DOMAIN}:443": {
          "Handlers": { "/": { "Proxy": "http://127.0.0.1:{{ .Values.port }}" } }
        }
      },
      "AllowFunnel": { "${TS_CERT_DOMAIN}:443": {{ .Values.tailscale.serve.funnel }} }
    }
{{- end }}
