{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openchamber-data
  labels:
    {{- include "openchamber.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- if .Values.tailscale.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openchamber-tailscale-state
  labels:
    {{- include "openchamber.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: 100Mi
{{- end }}
{{- end }}
