{{- if and .Values.tailscale.enabled (not .Values.tailscale.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: openchamber-tailscale
  labels:
    {{- include "openchamber.labels" . | nindent 4 }}
type: Opaque
stringData:
  TS_AUTHKEY: {{ required "tailscale.authKey or tailscale.existingSecret is required" .Values.tailscale.authKey | quote }}
{{- end }}
{{- if and .Values.ui.password (not .Values.ui.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: openchamber-ui
  labels:
    {{- include "openchamber.labels" . | nindent 4 }}
type: Opaque
stringData:
  ui-password: {{ .Values.ui.password | quote }}
{{- end }}
